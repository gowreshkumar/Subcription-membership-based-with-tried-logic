<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dashboard – Member Vaults</title>
  <meta name="description" content="Your Member Vaults dashboard — view your active plan, expiry countdown, and tier-unlocked content."/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/components.css"/>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container">
      <a class="nav-logo" href="index.html"><span>🔐</span> Member Vaults</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="plans.html">Plans</a></li>
      </ul>
      <div class="nav-actions">
        <div class="nav-user">
          <span>👤</span><span>Welcome, <strong id="nav-username">…</strong></span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
      </div>
    </div>
  </nav>

  <div class="page-content">
    <div class="container">

      <!-- Welcome -->
      <div style="margin-bottom:2rem">
        <p class="small" style="color:var(--text-muted);margin-bottom:.25rem">MEMBER DASHBOARD</p>
        <h1 id="welcome-text" style="font-size:1.75rem;font-weight:800">Loading…</h1>
      </div>

      <!-- Sub Banner -->
      <div class="sub-banner glass" id="sub-banner">
        <div class="spinner" style="margin:0;width:22px;height:22px"></div>
        <span style="color:var(--text-muted)">Loading subscription…</span>
      </div>

      <!-- Stats Row -->
      <div class="grid-4 mb-3">
        <div class="dash-stat glass">
          <div class="dash-stat-icon">⏱️</div>
          <div class="dash-stat-value" style="font-size:1rem" id="expiry-countdown">—</div>
          <div class="dash-stat-label">Expires In</div>
        </div>
        <div class="dash-stat glass">
          <div class="dash-stat-icon">📚</div>
          <div class="dash-stat-value">200+</div>
          <div class="dash-stat-label">Lessons Available</div>
        </div>
        <div class="dash-stat glass">
          <div class="dash-stat-icon">🌐</div>
          <div class="dash-stat-value">5K+</div>
          <div class="dash-stat-label">Community Members</div>
        </div>
        <div class="dash-stat glass">
          <div class="dash-stat-icon">🚀</div>
          <div class="dash-stat-value">24/7</div>
          <div class="dash-stat-label">Platform Access</div>
        </div>
      </div>

      <!-- Tier Content -->
      <div style="margin-bottom:1.5rem">
        <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:1rem">
          🔓 Your Content Access
          <span class="small" style="margin-left:.5rem">Locked sections require a higher tier</span>
        </h2>
        <div id="tier-content">
          <div class="flex-center" style="padding:3rem 0">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 <span class="gradient-text">Member Vaults</span>. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
