<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Create Account – Member Vaults</title>
  <meta name="description" content="Join Member Vaults. Register and choose your membership plan — Free, Silver, Gold, or Premium."/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/components.css"/>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <nav class="navbar">
    <div class="container">
      <a class="nav-logo" href="index.html"><span>🔐</span> Member Vaults</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="plans.html">Plans</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
      <div class="nav-actions">
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
      </div>
    </div>
  </nav>

  <div class="auth-page" style="padding-top:5rem">
    <div class="auth-card glass fade-up" style="max-width:520px">
      <div style="text-align:center;margin-bottom:2rem">
        <div style="font-size:3rem;margin-bottom:.5rem">🚀</div>
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Join thousands of members. Start for free.</p>
      </div>

      <form class="auth-form" id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username" placeholder="your_username" required autocomplete="username"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Min. 6 characters" required autocomplete="new-password"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input class="form-input" type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required autocomplete="new-password"/>
        </div>

        <!-- Plan Selector -->
        <div class="form-group">
          <label class="form-label" for="plan-select">Choose Your Plan</label>
          <select class="form-input" id="plan-select" name="plan_id">
            <option value="1">Loading plans…</option>
          </select>
        </div>

        <!-- Plan tier visual hint -->
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:-.5rem">
          <div class="glass text-center" style="padding:.6rem .4rem;border-radius:8px">
            <div style="font-size:1.1rem">🆓</div>
            <div style="font-size:.68rem;color:#6b7280;font-weight:700;margin-top:.2rem">Free</div>
          </div>
          <div class="glass text-center" style="padding:.6rem .4rem;border-radius:8px">
            <div style="font-size:1.1rem">🥈</div>
            <div style="font-size:.68rem;color:#94a3b8;font-weight:700;margin-top:.2rem">Silver</div>
          </div>
          <div class="glass text-center" style="padding:.6rem .4rem;border-radius:8px;border-color:rgba(245,158,11,.3)">
            <div style="font-size:1.1rem">🥇</div>
            <div style="font-size:.68rem;color:#f59e0b;font-weight:700;margin-top:.2rem">Gold</div>
          </div>
          <div class="glass text-center" style="padding:.6rem .4rem;border-radius:8px;border-color:rgba(168,85,247,.3)">
            <div style="font-size:1.1rem">💎</div>
            <div style="font-size:.68rem;color:#a855f7;font-weight:700;margin-top:.2rem">Premium</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:1rem">Create Account →</button>
      </form>

      <div class="auth-footer">
        Already a member? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
